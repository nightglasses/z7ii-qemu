name: QEMU synthetic smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-smoke:
    runs-on: [self-hosted, linux, x64, nightglass-qemu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev ninja-build pkg-config python3-venv
      - name: Fetch pinned upstream QEMU
        run: |
          mkdir -p work/upstream
          git init work/upstream/qemu
          git -C work/upstream/qemu remote add origin https://github.com/qemu/qemu.git
          git -C work/upstream/qemu fetch --depth 1 origin 4fc49f46dc95d4a27de2509e7fceb2931e91faeb
          git -C work/upstream/qemu checkout --detach FETCH_HEAD
      - name: Integrate and build ARM system emulator
        run: scripts/build-qemu.sh "$GITHUB_WORKSPACE/work/upstream/qemu" "$GITHUB_WORKSPACE/work/build/mas-diagnostic"
      - name: Execute synthetic ARM self-loop
        env:
          PYTHONPATH: ${{ github.workspace }}/work/upstream/qemu/python
        run: work/build/mas-diagnostic/pyvenv/bin/python scripts/smoke-test.py work/build/mas-diagnostic/qemu-system-arm work/smoke
      - name: Execute synthetic MEMC and secure timer contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/work/upstream/qemu/python
        run: work/build/mas-diagnostic/pyvenv/bin/python scripts/device-smoke-test.py work/build/mas-diagnostic/qemu-system-arm work/device-smoke
      - name: Execute synthetic two-core WFE rendezvous
        env:
          PYTHONPATH: ${{ github.workspace }}/work/upstream/qemu/python
        run: work/build/mas-diagnostic/pyvenv/bin/python scripts/smp-smoke-test.py work/build/mas-diagnostic/qemu-system-arm work/smp-smoke
      - name: Preserve complete local arm-smoke evidence
        if: always()
        run: |
          target="/local/evidence/$GITHUB_REPOSITORY/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/arm-smoke"
          mkdir -p "$(dirname "$target")"
          mkdir "$target"
          printf 'repository=%s\nsha=%s\nrun=%s\nattempt=%s\njob=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > "$target/run.txt"
          if test -e work; then mv work "$target/"; fi

