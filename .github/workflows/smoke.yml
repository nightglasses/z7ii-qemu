name: QEMU synthetic smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglib2.0-dev libpixman-1-dev libcairo2-dev libfdt-dev zlib1g-dev ninja-build pkg-config python3-venv
      - name: Build native ARM system emulator
        run: make -j2
      - name: Run native qtest contracts
        run: make check
      - name: Preserve synthetic test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-qtest
          path: |
            work/build/qemu/meson-logs/
          if-no-files-found: ignore
